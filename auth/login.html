<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <title>Login | APEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <section class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6 sm:p-10">
    <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600 absolute top-0 left-0 w-full"></div>

    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 mb-4">
            <img src="../assets/images/logo.thumbnail" alt="APEC Mavic Investment Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-xl sm:text-3xl font-extrabold text-slate-900 leading-tight">
            APEC MAVIC INVESTMENT
        </h1>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">
                Email Address
            </label>
            <input type="email" id="email" class="w-full px-4 py-3 sm:py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none" placeholder="name@example.com">
            <p id="email-error" class="text-rose-600 text-xs mt-1 hidden"></p>
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">
                Password
            </label>

            <div class="relative">
                <input
                    type="password"
                    id="password"
                    class="w-full px-4 py-3 sm:py-4 pr-12 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none"
                    placeholder="••••••••"
                >

                <button
                    type="button"
                    id="toggle-password"
                    aria-label="Show password"
                    aria-pressed="false"
                    class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 hover:text-blue-600"
                >
                    <i id="password-eye-icon" class="fas fa-eye"></i>
                </button>
            </div>

            <p id="password-error" class="text-rose-600 text-xs mt-1 hidden"></p>
        </div>


        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 sm:py-4 rounded-2xl font-bold text-lg shadow-lg transition">
            Continue
        </button>
    </form>

<!-- OTP Form -->
<div id="auth-message" class="hidden text-sm text-center text-slate-600 mb-4">
    A verification code was sent to your email.
</div>

<form id="otp-form" class="space-y-5 hidden">
    <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">
            Verification Code
        </label>
        <input
            type="text"
            id="otp"
            maxlength="6"
            inputmode="numeric"
            class="w-full text-center tracking-[0.5em] text-xl font-bold px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-100 outline-none"
            placeholder="000000"
        >
    </div>

    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold text-lg">
        Verify Code
    </button>
</form>

</section>


<script src="auth.js"></script>
<script src="../assets/js/toast.js"></script>

</body>
</html>
